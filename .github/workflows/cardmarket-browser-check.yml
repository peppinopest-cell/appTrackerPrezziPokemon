name: Cardmarket reader candidate diagnostic
on:
  push:
    branches: [codex/cardmarket-browser-diagnostic]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install standard browser
        run: |
          python -m pip install playwright beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Verify parser
        run: python reader-candidate/test_reader.py
      - name: Read supplied product URL once
        run: python reader-candidate/check_cloud.py
