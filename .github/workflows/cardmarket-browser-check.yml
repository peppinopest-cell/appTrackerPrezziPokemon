name: Cardmarket warm session and five minute verification
on:
  push:
    branches: [codex/cardmarket-browser-diagnostic]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        method: [curl_cffi, chromium, flaresolverr]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser
        run: python -m pip install beautifulsoup4 requests
      - name: Install HTTP transport
        if: matrix.method == 'curl_cffi'
        run: python -m pip install curl_cffi
      - name: Install standard Chromium
        if: matrix.method == 'chromium'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start isolated FlareSolverr
        if: matrix.method == 'flaresolverr'
        run: docker run -d --name reader-solver -p 127.0.0.1:8191:8191 --shm-size=1g -e LOG_LEVEL=warning ghcr.io/flaresolverr/flaresolverr:latest
      - name: Verify anonymous HTTP session
        if: matrix.method == 'curl_cffi'
        run: python reader-candidate/check_warm_readers.py curl_cffi
      - name: Verify anonymous standard browser
        if: matrix.method == 'chromium'
        run: xvfb-run -a python reader-candidate/check_warm_readers.py chromium
      - name: Verify repeated five minute read
        if: matrix.method == 'flaresolverr'
        run: python reader-candidate/check_warm_readers.py flaresolverr
      - name: Measure solver memory
        if: always() && matrix.method == 'flaresolverr'
        run: |
          docker stats --no-stream --format '{{.MemUsage}}' reader-solver
          docker stop reader-solver
