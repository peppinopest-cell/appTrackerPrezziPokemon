name: Cardmarket Camoufox diagnostic
on:
  push:
    branches: [codex/cardmarket-browser-diagnostic]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install diagnostic dependencies
        run: |
          python -m pip install camoufox requests beautifulsoup4
          python -m playwright install-deps firefox
          python -m camoufox fetch
      - name: Read one public product page
        run: PYTHONPATH=. python scripts/check_camoufox_cardmarket.py
