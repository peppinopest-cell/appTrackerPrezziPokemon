name: Cardmarket anonymous session continuity
on:
  push:
    branches: [codex/cardmarket-browser-diagnostic]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        method: [flaresolverr]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser
        run: python -m pip install beautifulsoup4 requests
      - name: Start Byparr
        if: matrix.method == 'byparr'
        run: |
          docker pull ghcr.io/thephaseless/byparr:latest
          docker run -d --name reader-solver -p 127.0.0.1:8191:8191 --shm-size=1g ghcr.io/thephaseless/byparr:latest
          docker inspect reader-solver --format '{{.Image}}'
      - name: Start FlareSolverr
        if: matrix.method == 'flaresolverr'
        run: |
          docker pull ghcr.io/flaresolverr/flaresolverr:latest
          docker run -d --name reader-solver -p 127.0.0.1:8191:8191 --shm-size=1g -e LOG_LEVEL=warning ghcr.io/flaresolverr/flaresolverr:latest
          docker inspect reader-solver --format '{{.Image}}'
      - name: Install Zendriver
        if: matrix.method == 'zendriver'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth
          python -m pip install zendriver
      - name: Read supplied product through solver
        if: matrix.method != 'zendriver'
        run: python reader-candidate/check_anonymous_session.py
      - name: Read supplied product through Zendriver
        if: matrix.method == 'zendriver'
        run: xvfb-run -a python reader-candidate/check_solvers.py zendriver
      - name: Stop isolated container
        if: always() && matrix.method != 'zendriver'
        run: docker stop reader-solver || true
