name: Cardmarket legacy transport diagnostic
on:
  push:
    branches: [codex/cardmarket-browser-diagnostic]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install diagnostic browser
        run: |
          python -m pip install cloudscraper==1.2.71 requests beautifulsoup4
      - name: Read one public product page
        run: PYTHONPATH=. python scripts/check_legacy_cardmarket.py
