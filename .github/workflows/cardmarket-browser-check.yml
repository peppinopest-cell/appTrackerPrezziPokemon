name: Cardmarket standard browser diagnostic
on:
  push:
    branches: [codex/cardmarket-browser-diagnostic]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install diagnostic browser
        run: |
          python -m pip install playwright requests beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Read one public product page
        run: PYTHONPATH=. python scripts/check_cardmarket_browser.py
