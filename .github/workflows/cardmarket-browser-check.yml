name: Cardmarket TLS compatibility diagnostic
on:
  push:
    branches: [codex/cardmarket-browser-diagnostic]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Install diagnostic dependencies
        run: python -m pip install curl_cffi beautifulsoup4 requests
      - name: Read one public product page
        run: PYTHONPATH=. python scripts/check_cardmarket_tls.py
