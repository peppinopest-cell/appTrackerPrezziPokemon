name: CloakBrowser API integration checks
on:
  push:
    branches: [codex/cloakbrowser-integration]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_cloakbrowser*.py'
      - run: docker build -t pricebot-cloak:test .
      - run: docker run -d --name bot --memory=512m --memory-swap=512m -p 127.0.0.1:10000:10000 -e PORT=10000 pricebot-cloak:test
      - run: python scripts/check_cloakbrowser_container.py
      - if: always()
        run: docker stop --time 5 bot || true
