name: FlareSolverr bot integration
on:
  push:
    branches: [codex/flaresolverr-integration]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test reader behavior
        run: |
          python -m pip install requests beautifulsoup4
          python -m unittest discover -s tests -p test_flaresolverr_reader.py
      - name: Build combined bot and solver
        run: docker build -t pricebot-flaresolverr:test .
      - name: Start with free instance memory limit
        run: docker run -d --name bot-flare --memory=512m --memory-swap=512m -p 127.0.0.1:10000:10000 -e PORT=10000 pricebot-flaresolverr:test
      - name: Verify actual API price retrieval
        run: python scripts/check_flaresolverr_container.py
      - name: Report memory and process state
        if: always()
        run: |
          docker stats --no-stream --format '{{.MemUsage}}' bot-flare || true
          docker inspect --format 'status={{.State.Status}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}}' bot-flare || true
          docker stop bot-flare || true
